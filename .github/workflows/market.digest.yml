name: Daily Market Digest

on:
  schedule:
    # Runs at 5:00 PM ET (22:00 UTC) on weekdays only.
    # Adjust if your timezone observes daylight saving time differently:
    #   EDT (summer)  → UTC-4 → 21:00 UTC
    #   EST (winter)  → UTC-5 → 22:00 UTC
    # The cron below uses 22:00 UTC (EST / winter time).
    # Change to "0 21 * * 1-5" when US markets are on summer time (EDT).
    - cron: "0 22 * * 1-5"

  # Allow a manual trigger from the Actions tab for testing
  workflow_dispatch:

jobs:
  send-digest:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install yfinance

      - name: Run market digest agent
        env:
          GMAIL_USER:     ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASS: ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_TO:       ${{ secrets.EMAIL_TO }}
        run: python fetch_and_email.py
